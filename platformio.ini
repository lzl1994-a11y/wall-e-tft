[platformio]
; Keep generated build files on an ASCII-only path. The Windows xtensa linker
; can fail to create firmware.map when the project path contains Chinese text.
build_dir = E:/walle/wall-e-tft/pio-build/wall-e-tft

[env:esp32]
platform = espressif32
board = walle-esp32s3-n16r8
framework = arduino

; Production memory and upload settings are defined in
; boards/walle-esp32s3-n16r8.json.

monitor_speed = 115200
upload_speed = 921600
lib_deps =
  moononournation/GFX Library for Arduino@1.5.6
  bitbank2/AnimatedGIF
  bitbank2/JPEGDEC@1.8.4
build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; Route Arduino Serial to the ESP32-S3 native USB Serial/JTAG CDC port.
  -DARDUINO_USB_CDC_ON_BOOT=1
  
